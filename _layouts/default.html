<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    (function () {
      var qp = new URLSearchParams(location.search).get('lang');
      var mode = (qp === 'en' || qp === 'bilingual') ? qp : (localStorage.getItem('dfp-lang-mode') === 'en' ? 'en' : 'bilingual');
      if (mode === 'en') document.documentElement.classList.add('lang-en');
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">🎓 Learning Dutch for Persians</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Lessons</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <button id="lang-toggle-btn" class="lang-toggle-btn" type="button">
        <span class="label-bilingual">🌐 Hide Persian</span>
        <span class="label-en">🌐 Show Persian</span>
      </button>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Learning Dutch for Persians — made for self-study, A0→A1. <span dir="rtl" lang="fa">با عشق برای ایرانی‌ها ساخته شده</span></p>
  </footer>

  <script src="{{ '/assets/js/progress.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/lang.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/quiz.js' | relative_url }}" defer></script>
  {% if page.layout == 'home' or page.url == '/' %}
  <script src="{{ '/assets/js/progress-home.js' | relative_url }}" defer></script>
  {% endif %}
</body>
</html>
