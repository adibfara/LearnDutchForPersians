<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">🇳🇱 Dutch for Persians</a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">Lessons</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Dutch for Persians — made for self-study, A0→A1. <span dir="rtl" lang="fa">با عشق برای فارسی‌زبانان ساخته شده</span></p>
  </footer>

  <script src="{{ '/assets/js/quiz.js' | relative_url }}" defer></script>
</body>
</html>
