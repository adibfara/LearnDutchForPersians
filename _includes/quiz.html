{% assign quiz_id = "quiz-" | append: include.id %}
<section class="quiz-block" id="{{ quiz_id }}">
  <h2>📝 Practice / <span dir="rtl" lang="fa">تمرین</span></h2>
  <div class="quiz-root" data-quiz-id="{{ quiz_id }}" data-lesson-slug="{{ include.id }}"></div>
  <script type="application/json" class="quiz-data">
    {{ include.quiz | jsonify }}
  </script>
</section>
